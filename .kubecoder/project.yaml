# `setup` runs `uv sync`, not `uv sync --locked`: a freshly generated app has
# no uv.lock until the first setup writes it. Commit both locks (root and
# backend/); CI, the suite runner and the Dockerfile sync `--locked`.
projects:
  root:
    description: >-
      SonosController monorepo — orchestration tooling (the suite runner), the
      shared Procfile.dev dev stack, and CI.
    setup: cexec python uv sync
    # The root's own Python, and the architecture model; backend/ lints itself.
    lint:
      # The rule set and the Ruff version are pinned in the root pyproject.toml.
      - cexec python uv run ruff check scripts tools
      # The model AaC/SonosController validates (Jenkinsfile.architecture).
      # A new app has none until it is seeded (CLAUDE.md), and this skips it.
      # arch-validate exits 0 valid, 1 invalid, 2 transport: a 2 is the
      # architecture service, not this repository.
      - "if ls docs/architecture/*.yaml >/dev/null 2>&1; then cexec aac-tools arch-validate docs/architecture/*.yaml; else echo 'No architecture model in docs/architecture/ yet: CLAUDE.md says how to seed it'; fi"
    # No `test:` here on purpose. The root project owns `run-suite`
    # (tools/suite_runner), which is CI's single entry point and runs the
    # backend suite itself — declaring it here would make `kc project test`
    # run it an extra time. The backend's verb below is that same suite. CI
    # keeps using `uv run run-suite` because it also needs the JUnit XML and
    # the ===SUITE_RESULT:=== markers the Jenkinsfile parses.

  backend:
    description: >-
      Plays music from a Plex library on Sonos speakers and serves the touch-screen displays that control them — Flask backend.
    setup:
      - cexec python uv sync
      # Adds to the git-ignored .env the settings the app cannot start without
      # and .env lacks: the database, the speakers' addresses from the deploy
      # repo's prd values, this environment's own name for their events.
      - cexec python uv run python scripts/write_dev_env.py
      - cexec python uv run python scripts/init-dev-database.py
      - cexec python uv run cli upgrade-db
    test: cexec python uv run pytest
    # The same three checks backend/scripts/check.py runs.
    lint:
      - cexec python uv run ruff check .
      - cexec python uv run mypy .
      - cexec python uv run vulture app/ vulture_whitelist.py --min-confidence 80
